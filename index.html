<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo TV Head</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
    
    :root {
        --accent: #1a1714;           
        --highlight: #5f6670;        
        --ink: #18191b;
        --muted: #686c72;
        --bg: #d9d9d8;               
        --bg-deep: #a9aaab;
        --stage:#9b9da0;            
        --stage-deep: #73767a;
        --font: 'Geist', system-ui, -apple-system, sans-serif;
        --serif: 'Instrument Serif', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
    }

    .fh {
        position: relative;
        height: 100vh;
        height: 100svh;
        min-height: 600px;
        overflow: hidden;
        isolation: isolate;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
        background:
            radial-gradient(ellipse 50% 60% at 50% 45%, rgba(255,255,255,.75), transparent 72%),
            radial-gradient(ellipse 120% 90% at 50% 40%, transparent 55%, rgba(30,32,36,.09) 100%),
            linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    
    .fh-copy {
        position: relative;
        z-index: 2;
        padding: 0 clamp(24px, 4vw, 40px) 0 clamp(24px, 8vw, 140px);
    }
    .fh-kicker {
        display: block;
        margin-bottom: clamp(14px, 2.4vh, 22px);
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .fh h1 {
        font-weight: 600;
        font-size: clamp(2.6rem, min(6.2vw, 9vh), 5.6rem);
        line-height: .98;
        letter-spacing: -.05em;
    }
    .fh-accent {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
        letter-spacing: -.01em;
        color: var(--highlight);
    }
    .fh-sub {
        margin-top: clamp(16px, 2.6vh, 26px);
        max-width: 420px;
        font-size: clamp(1rem, min(1.4vw, 2.3vh), 1.12rem);
        line-height: 1.6;
        color: var(--muted);
        text-wrap: pretty;
    }
    .fh-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: clamp(22px, 4vh, 36px);
    }
    .fh-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.9rem 1.6rem;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -.01em;
        text-decoration: none;
        transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .fh-btn svg { width: 16px; height: 16px; transition: translate .15s ease; }
    .fh-btn--primary {
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 14px 28px -14px rgba(24,25,27,.7);
    }
    .fh-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 18px 32px -14px rgba(24,25,27,.8); }
    .fh-btn--primary:hover svg { translate: 3px 0; }
    .fh-btn--ghost {
        background: rgba(255,255,255,.6);
        color: var(--ink);
        border: 1px solid rgba(30,32,36,.16);
        backdrop-filter: blur(6px);
    }
    .fh-btn--ghost:hover { transform: translateY(-2px); border-color: rgba(30,32,36,.3); }
    .fh-btn:focus-visible { outline: 3px solid rgba(95,102,112,.4); outline-offset: 3px; }

    .fh-figure {
        position: relative;
        z-index: 1;
        height: 100%;
        align-self: stretch;
    }
    .fh-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 1.2s ease;
    }
    .fh.is-ready .fh-canvas { opacity: 1; }
    .fh-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: var(--muted);
        transition: opacity .4s ease;
    }
    .fh.is-ready .fh-loading { opacity: 0; }

    .fh-copy > * { opacity: 0; translate: 0 16px; transition: opacity .8s ease, translate .8s cubic-bezier(.16,1,.3,1); }
    .fh.is-ready .fh-copy > * { opacity: 1; translate: 0 0; }
    .fh.is-ready .fh-copy > :nth-child(1) { transition-delay: .5s; }
    .fh.is-ready .fh-copy > :nth-child(2) { transition-delay: .65s; }
    .fh.is-ready .fh-copy > :nth-child(3) { transition-delay: .8s; }
    .fh.is-ready .fh-copy > :nth-child(4) { transition-delay: .95s; }

    @media (prefers-reduced-motion: reduce) {
        .fh-canvas, .fh-copy > * { transition: none; }
    }

    .fh-copy {
        position: absolute;
        z-index: 3;
        left: 0; top: 0; bottom: 0;
        width: min(560px, 44vw);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 0 0 clamp(24px, 4.5vw, 72px);
        pointer-events: none;
    }
    .fh-copy > * { pointer-events: auto; }
    .fh-copy { transition: opacity .7s ease .25s, visibility 0s linear 0s; }
    .fh[data-started="0"] .fh-copy { opacity: 0; visibility: hidden; transition: none; }
    .fh[data-started="0"] { cursor: pointer; }
    .fh-status {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: clamp(14px, 2.4vh, 22px);
        font-size: .8rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
        color: var(--muted);
    }
    .fh-status i {
        width: 8px; height: 8px; border-radius: 50%;
        background: #9aa0a8; transition: background .3s, box-shadow .3s;
    }
    .fh[data-state="listening"] .fh-status i { background: #2f9e6b; box-shadow: 0 0 0 5px rgba(47,158,107,.18); }
    .fh[data-state="thinking"] .fh-status i { background: #d79a2b; animation: fh-pulse 1s ease-in-out infinite; }
    .fh[data-state="speaking"] .fh-status i { background: #3d7bff; box-shadow: 0 0 0 5px rgba(61,123,255,.18); }
    .fh[data-state="connecting"] .fh-status i { animation: fh-pulse 1s ease-in-out infinite; }
    @keyframes fh-pulse { 50% { opacity: .35; } }

    .fh-transcript {
        display: flex; flex-direction: column; justify-content: flex-end;
        gap: .7rem;
        min-height: 9rem; max-height: 46vh;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
                mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
    }
    .fh-msg {
        font-size: clamp(1.25rem, 2vw, 1.85rem);
        line-height: 1.18; letter-spacing: -.025em; font-weight: 500;
        text-wrap: pretty;
        max-height: 2.4em;              
        overflow: hidden;
        scroll-behavior: smooth;
        transition: opacity .5s ease, filter .5s ease, font-size .4s ease;
        animation: fh-in .5s cubic-bezier(.16,1,.3,1);
    }
    @keyframes fh-in { from { opacity: 0; translate: 0 10px; } }
    .fh-msg--user { color: var(--muted); font-size: clamp(1rem, 1.35vw, 1.2rem); font-weight: 400; }
    .fh-msg--user::before { content: "You  "; font-size: .7em; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    .fh-msg.is-old   { opacity: .38; filter: blur(2.5px); font-size: clamp(1rem, 1.4vw, 1.25rem); }
    .fh-msg.is-older { opacity: .16; filter: blur(5px);  font-size: clamp(1rem, 1.4vw, 1.25rem); }
    .fh-msg.is-live:not(.fh-msg--user)::after {
        content: ""; display: inline-block; width: .5em; height: .95em; margin-left: .25em;
        vertical-align: -.1em; background: var(--ink); animation: fh-blink 1s steps(1) infinite;
    }
    @keyframes fh-blink { 50% { opacity: 0; } }

    .fh-controls { display: flex; align-items: center; gap: 12px; margin-top: clamp(16px, 2.6vh, 24px); }
    .fh-talk {
        font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 10px;
        padding: .85rem 1.5rem; border-radius: 999px; border: 0;
        background: var(--accent); color: #fff;
        box-shadow: 0 14px 28px -14px rgba(24,25,27,.7);
        transition: transform .15s ease, background .2s ease;
    }
    .fh-talk:hover { transform: translateY(-2px); }
    .fh-talk:focus-visible { outline: 3px solid rgba(95,102,112,.45); outline-offset: 3px; }
    .fh-talk svg { width: 16px; height: 16px; }
    .fh[data-live="1"] .fh-talk { background: #b3362f; }
    .fh-hint { font-size: .8rem; color: var(--muted); }

    /* "Ask Echo" question pills, shown after the first greeting */
    .fh-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: clamp(14px, 2.2vh, 20px); max-width: 520px; }
    .fh-chips-label {
        width: 100%; margin-bottom: 2px;
        font-size: .72rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    }
    .fh-chips > * { opacity: 0; translate: 0 8px; pointer-events: none; transition: opacity .45s ease, translate .5s cubic-bezier(.16,1,.3,1); }
    .fh[data-chips="1"] .fh-chips > * { opacity: 1; translate: 0 0; pointer-events: auto; }
    .fh[data-chips="1"] .fh-chips > :nth-child(2) { transition-delay: .08s; }
    .fh[data-chips="1"] .fh-chips > :nth-child(3) { transition-delay: .16s; }
    .fh[data-chips="1"] .fh-chips > :nth-child(4) { transition-delay: .24s; }
    .fh-chip {
        font: inherit; font-size: .88rem; font-weight: 500; color: var(--ink); cursor: pointer;
        display: inline-flex; align-items: center; gap: 8px;
        padding: .55rem 1rem .55rem .7rem; border-radius: 999px;
        background: rgba(255,255,255,.62); border: 1px solid rgba(30,32,36,.14);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        box-shadow: 0 8px 20px -16px rgba(24,25,27,.6);
        transition: opacity .45s ease, translate .5s cubic-bezier(.16,1,.3,1), transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
    }
    .fh-chip:hover { transform: translateY(-2px); border-color: rgba(30,32,36,.32); background: rgba(255,255,255,.85); }
    .fh-chip:focus-visible { outline: 3px solid rgba(95,102,112,.4); outline-offset: 2px; }
    .fh-chip-ico {
        display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
        background: var(--ink); color: #fff; flex: none;
    }
    .fh-chip-ico svg { width: 12px; height: 12px; }
    .fh-chip-eq { display: none; gap: 2px; align-items: flex-end; height: 12px; }
    .fh-chip-eq i { width: 2px; background: currentColor; border-radius: 1px; animation: fh-eq .5s ease-in-out infinite alternate; }
    .fh-chip-eq i:nth-child(2) { animation-delay: .15s; }
    .fh-chip-eq i:nth-child(3) { animation-delay: .3s; }
    @keyframes fh-eq { from { height: 3px; } to { height: 12px; } }
    .fh-chip.is-active, .fh-chip.is-active:hover { background: var(--ink); color: #fff; border-color: var(--ink); transition: transform .15s ease; }
    .fh-chip.is-active .fh-chip-ico { background: #3d7bff; }
    .fh-chip.is-active .fh-chip-ico svg { display: none; }
    .fh-chip.is-active .fh-chip-eq { display: inline-flex; }
    .fh-credit.is-glow { animation: fh-glow 1.6s ease-in-out infinite; }
    @keyframes fh-glow { 50% { box-shadow: 0 0 0 6px rgba(61,123,255,.18), 0 10px 30px -18px rgba(24,25,27,.45); background: rgba(255,255,255,.85); } }
    @media (prefers-reduced-motion: reduce) {
        .fh-chip-eq i, .fh-credit.is-glow { animation: none; }
    }
    @media (max-width: 860px) {
        .fh-chips { gap: 6px; margin-top: 12px; }
        .fh-chip { font-size: .8rem; padding: .42rem .8rem .42rem .5rem; gap: 6px; }
        .fh-chip-ico { width: 20px; height: 20px; }
        .fh[data-chips="1"] .fh-transcript { min-height: 3.5rem; }
    }

    @media (max-width: 860px) {
        .fh-copy {
            top: auto; width: 100%; padding: 60px 20px 20px; justify-content: flex-end;
            background: linear-gradient(to top, rgba(169,170,171,.95) 40%, transparent);
        }
        .fh-transcript { max-height: 30vh; min-height: 5rem; }
    }
    
    /* Credit: a small frosted signature card */
    .fh-credit {
        position: fixed; left: 24px; bottom: 20px; z-index: 5;
        display: flex; align-items: center; gap: 10px;
        padding: 6px 16px 6px 6px; border-radius: 16px;
        background: rgba(255,255,255,.5);
        border: 1px solid rgba(30,32,36,.1);
        box-shadow: 0 10px 30px -18px rgba(24,25,27,.45);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        font-size: .78rem; color: var(--muted); line-height: 1.3;
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .fh-credit:hover { transform: translateY(-2px); background: rgba(255,255,255,.7); box-shadow: 0 16px 34px -18px rgba(24,25,27,.55); }
    .fh-credit a { color: var(--ink); text-decoration: none; font-weight: 600; }
    .fh-credit a:hover { text-decoration: underline; text-underline-offset: 2px; }
    .fh-credit a:focus-visible { outline: 2px solid rgba(95,102,112,.5); outline-offset: 2px; border-radius: 4px; }
    .fh-who { display: flex; flex-direction: column; }
    .fh-role { font-size: .9em; }
    .fh-role a { font-weight: 500; }
    .fh-role a::after { content: " ↗"; font-size: .85em; opacity: .55; }
    .fh-credit .fh-in {
        flex: none; display: inline-flex; width: 34px; height: 34px; border-radius: 11px;
        align-items: center; justify-content: center; background: #0a66c2; color: #fff;
        box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
        transition: transform .2s cubic-bezier(.3,1.6,.5,1);
    }
    .fh-credit .fh-in:hover { transform: rotate(-8deg) scale(1.08); text-decoration: none; }
    .fh-credit .fh-in svg { width: 16px; height: 16px; }
    @media (max-width: 860px) {
        .fh-credit { top: 14px; bottom: auto; left: 16px; padding: 5px 12px 5px 5px; font-size: .7rem; border-radius: 13px; gap: 8px; }
        .fh-credit .fh-in { width: 28px; height: 28px; border-radius: 9px; }
        .fh-credit .fh-in svg { width: 13px; height: 13px; }
    }

    /* ── Brand wordmark: "echo", with a tiny TV-head mascot standing in for the "o" ── */
    .fh-brand {
        position: absolute; top: clamp(18px, 3.2vh, 32px); right: clamp(20px, 3.6vw, 48px); z-index: 6;
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
        color: var(--ink); user-select: none;
        opacity: 0; translate: 0 -10px;
        transition: opacity .8s ease .3s, translate .8s cubic-bezier(.16,1,.3,1) .3s;
    }
    .fh.is-ready .fh-brand { opacity: 1; translate: 0 0; }
    .fh-word {
        display: flex; align-items: flex-end;
        font-weight: 700; font-size: clamp(2.6rem, 4.4vw, 4rem); line-height: .8;
        letter-spacing: -.07em;
        margin-bottom: .44em;
    }
    .fh-word > span { padding-bottom: .02em; }
    .fh-mascot {
        width: 1.42em; height: 1.7em; margin: 0 -.04em -.42em .04em;
        overflow: visible; cursor: pointer;
        transform-origin: 50% 100%;
        animation: fh-bob 3.2s ease-in-out infinite;
    }
    .fh-mascot .m-ink { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fh-mascot .m-face { fill: none; stroke: #8fb6ff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    .fh-mascot .m-glow { fill: #8fb6ff; }
    .fh-mascot .m-ant  { transform-origin: 50px 24px; animation: fh-wiggle 4s ease-in-out infinite; }
    .fh-mascot .m-tip  { fill: #f4f4f2; transition: fill .3s; }
    .fh-mascot .m-eyes { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
    .fh-mascot .m-blink { transform-box: fill-box; transform-origin: center; animation: fh-mblink 4.6s infinite; }
    .fh-mascot .m-legl, .fh-mascot .m-legr { transform-origin: 50px 84px; }
    .fh-mascot .m-zz { fill: var(--muted); font: 700 11px var(--font); opacity: 0; }

    /* asleep until the visitor clicks */
    .fh-mascot .m-sleep, .fh-mascot .m-talk { display: none; }
    .fh[data-started="0"] .fh-mascot .m-awake { display: none; }
    .fh[data-started="0"] .fh-mascot .m-sleep { display: inline; }
    .fh[data-started="0"] .fh-mascot .m-face { stroke: #5d7bb0; }
    .fh[data-started="0"] .fh-mascot { animation-duration: 5s; }
    .fh[data-started="0"] .fh-mascot .m-zz { animation: fh-zz 3s ease-in-out infinite; }
    .fh[data-started="0"] .fh-mascot .m-zz + .m-zz { animation-delay: 1.5s; }

    /* talking while Echo speaks */
    .fh[data-state="speaking"] .fh-mascot .m-smile { display: none; }
    .fh[data-state="speaking"] .fh-mascot .m-talk { display: inline; }
    .fh[data-state="speaking"] .fh-mascot .m-mouth { transform-box: fill-box; transform-origin: center; animation: fh-talkm .22s ease-in-out infinite alternate; }
    .fh[data-state="speaking"] .fh-mascot .m-tip { fill: #8fb6ff; }
    .fh[data-state="speaking"] .fh-mascot .m-ant { animation-duration: .9s; }

    /* hover: a little hop and a walk cycle */
    .fh-brand:hover .fh-mascot { animation: fh-hop .55s cubic-bezier(.3,1.6,.5,1); }
    .fh-brand:hover .m-legl { animation: fh-step .3s ease-in-out infinite alternate; }
    .fh-brand:hover .m-legr { animation: fh-step .3s ease-in-out infinite alternate-reverse; }

    .fh-tag {
        font-family: var(--serif); font-style: italic; font-size: clamp(.95rem, 1.2vw, 1.1rem);
        color: var(--muted); letter-spacing: 0; margin-top: .25em; padding-right: .1em;
    }
    .fh-tag b { font-weight: 400; color: var(--ink); }

    @keyframes fh-bob    { 50% { transform: translateY(-2px) rotate(-1.5deg); } }
    @keyframes fh-wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-9deg); } 88% { transform: rotate(7deg); } }
    @keyframes fh-mblink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes fh-talkm  { from { transform: scaleY(.35); } to { transform: scaleY(1.1); } }
    @keyframes fh-hop    { 40% { transform: translateY(-9px) rotate(4deg); } 70% { transform: translateY(0) scale(1.06, .94); } }
    @keyframes fh-step   { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
    @keyframes fh-zz     { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -16px); } }

    @media (prefers-reduced-motion: reduce) {
        .fh-mascot, .fh-mascot * { animation: none !important; }
    }
    @media (max-width: 860px) {
        .fh-brand { top: 12px; right: 16px; }
        .fh-word { font-size: 2.3rem; }
        .fh-tag { font-size: .85rem; }
    }
</style>
</head>
<body>

<section class="fh" aria-label="3D character" data-state="idle" data-live="0" data-started="0">
    <div class="fh-copy">
        <div class="fh-status"><i></i><span id="fh-status-text">Echo</span></div>
        <div class="fh-transcript" id="fh-transcript" aria-live="polite" aria-label="Echo's words"></div>
        <div class="fh-controls">
            <button class="fh-talk" id="fh-talk" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
                <span id="fh-talk-label">Say hello</span>
            </button>
            <span class="fh-hint" id="fh-hint">Turn your sound on</span>
        </div>
        <div class="fh-chips" id="fh-chips" role="group" aria-label="Ask Echo a question">
            <span class="fh-chips-label">Ask Echo</span>
        </div>
    </div>
    <div class="fh-figure" aria-hidden="true">
        <p class="fh-loading">Loading model…</p>
    </div>
    <div class="fh-brand" role="img" aria-label="Echo, the TV that says hello">
        <div class="fh-word" aria-hidden="true">
            <span>ech</span>
            <svg class="fh-mascot" viewBox="0 0 100 120" aria-hidden="true">
                <ellipse cx="50" cy="114" rx="26" ry="4.5" fill="rgba(24,25,27,.18)"/>
                <g class="m-legl"><path class="m-ink" d="M38 84 L35 104" fill="none"/><path class="m-ink" d="M28 104 h12 a3 3 0 0 1 0 6 h-12 a3 3 0 0 1 0-6z" fill="#f4f4f2"/></g>
                <g class="m-legr"><path class="m-ink" d="M62 84 L65 104" fill="none"/><path class="m-ink" d="M60 104 h12 a3 3 0 0 1 0 6 h-12 a3 3 0 0 1 0-6z" fill="#f4f4f2"/></g>

                    c = max(mix(vec3(lum), c, 1.45), 0.0);           // CRT phosphors are saturated
                    float stripe = mod(gl_FragCoord.x, 3.0);        // aperture-grille phosphors
                    vec3 mask = vec3(stripe < 1.0 ? 1.0 : 0.72, (stripe >= 1.0 && stripe < 2.0) ? 1.0 : 0.72, stripe >= 2.0 ? 1.0 : 0.72);
                    float sl = uv.y * 480.0;                           // scanlines, faded out before they can alias
                    float amp = 0.16 * clamp(1.0 - fwidth(sl) * 1.6, 0.0, 1.0);
                    float scan = 1.0 - amp + amp * sin(sl * 6.2832);
                    float vig = smoothstep(1.45, 0.35, length(q * vec2(0.9, 1.0)));
                    float roll = 1.0 + 0.06 * smoothstep(0.08, 0.0, abs(fract(uv.y - uTime * 0.12) - 0.5));

    }
    function makeTV() {
        const H = TV_HEIGHT, W = H * 1.08, D = H * 0.85;

        const fine = plasticBump.clone(); fine.repeat.set(70, 70); fine.needsUpdate = true;   // extrude UVs are in metres
        const shellMat = new THREE.MeshPhysicalMaterial({
            map: plasticColor, color: 0xdcdde0, roughnessMap: plasticRough, bumpMap: fine, bumpScale: 0.35,
            roughness: 0.48, metalness: 0, clearcoat: 0.18, clearcoatRoughness: 0.5, sheen: 0.1, sheenColor: 0xffffff });
        const bezelMat = new THREE.MeshPhysicalMaterial({ color: 0x232428, roughness: 0.42, bumpMap: fine, bumpScale: 0.25, clearcoat: 0.25, clearcoatRoughness: 0.35 });

        const darkMat  = new THREE.MeshPhysicalMaterial({ color: 0x1a1b1e, roughness: 0.5, bumpMap: plasticBump, bumpScale: 0.4, clearcoat: 0.2 });

        const hw = W * 0.78, hh = H * 0.6, hy = H * 0.07, hr = H * 0.07;

        const fd = H * 0.05, bt = H * 0.028;
        const frameShape = roundedRect(W - bt * 2, H - bt * 2, H * 0.1);
        frameShape.holes.push(roundedPath(hw + bt * 2, hh + bt * 2, hr + bt, 0, hy));
        const frontZ = D / 2;
        add(new THREE.ExtrudeGeometry(frameShape, { depth: fd, bevelEnabled: true, bevelThickness: bt, bevelSize: bt, bevelSegments: 6, curveSegments: 18 }),

        const frameBack = frontZ - fd - bt * 2;

        const caseD = D * 0.36, caseZ = frameBack - caseD / 2 + H * 0.004;
        add(new RoundedBoxGeometry(W * 0.975, H * 0.975, caseD, 6, H * 0.09), shellMat, 0, 0, caseZ);

        const backD = D * 0.44, backZ = caseZ - caseD / 2 - backD / 2 + H * 0.03;
        const back = new RoundedBoxGeometry(W * 0.82, H * 0.8, backD, 6, H * 0.08);
        const bp = back.attributes.position;
        for (let i = 0; i < bp.count; i++) {
            const k = 1 - 0.28 * (0.5 - bp.getZ(i) / backD);      // 1 at the front of the housing, 0.72 at the back
            bp.setX(i, bp.getX(i) * k); bp.setY(i, bp.getY(i) * k);
        }
        back.computeVertexNormals();
        add(back, shellMat, 0, H * 0.02, backZ);

        const tunnelD = H * 0.075;
        const tunnel = roundedRect(hw + bt * 2, hh + bt * 2, hr + bt, 0, hy);
        tunnel.holes.push(roundedPath(hw - H * 0.004, hh - H * 0.004, hr - H * 0.002, 0, hy));
        add(new THREE.ExtrudeGeometry(tunnel, { depth: tunnelD, bevelEnabled: false, curveSegments: 18 }), bezelMat, 0, 0, frontZ - tunnelD - H * 0.004);

        const tubeZ = frontZ - tunnelD + H * 0.006;
        const tubeGeo = (bulge, inset) => {
            const g = new THREE.PlaneGeometry(hw - inset, hh - inset, 36, 24);
            const p = g.attributes.position;

                const u = p.getX(i) / (hw / 2), v = p.getY(i) / (hh / 2);

        add(tubeGeo(H * 0.035, H * 0.002), screenMat, 0, hy, tubeZ);

        lip.holes.push(roundedPath(hw - H * 0.03, hh - H * 0.03, hr - H * 0.012));
        add(new THREE.ShapeGeometry(lip, 18), cavityMat, 0, hy, tubeZ + H * 0.001);

        glowLight = new THREE.PointLight(0x5c9dff, 0, H * 3, 2);
        glowLight.position.set(0, hy - H * 0.1, frontZ + H * 0.3);
        tv.add(glowLight);

        const chinY = (-H / 2 + (hy - hh / 2 - bt)) / 2;
        const hole = new THREE.CircleGeometry(H * 0.0065, 14);
        for (let r = 0; r < 3; r++) for (let c = 0; c < 7; c++) {
            add(hole, cavityMat, -W * 0.36 + c * H * 0.022 + (r % 2) * H * 0.011, chinY + (1 - r) * H * 0.02, frontZ + 0.0004);
        }
        const plate = document.createElement('canvas'); plate.width = 256; plate.height = 64;
        const pg = plate.getContext('2d');
        pg.fillStyle = '#2a2b2f'; pg.font = '700 40px Arial, sans-serif'; pg.textAlign = 'center'; pg.textBaseline = 'middle';
        pg.fillText('E C H O', 128, 34);

        add(new THREE.PlaneGeometry(H * 0.16, H * 0.04), new THREE.MeshStandardMaterial({ map: plateTex, transparent: true, roughness: 0.5, metalness: 0.3 }),
            0, chinY, frontZ + 0.0006);

            const lit = i === 0;
            const m = new THREE.MeshStandardMaterial({ color: lit ? 0x5b8cff : 0x3a3c42, emissive: lit ? 0x3f6fff : 0x000000, emissiveIntensity: lit ? 8 : 0, roughness: 0.4 });
            add(new RoundedBoxGeometry(H * 0.026, H * 0.01, H * 0.008, 2, H * 0.004), m, W * 0.2 + i * H * 0.034, chinY, frontZ);

        const screw = new THREE.Group();

        const slot = add(new THREE.BoxGeometry(H * 0.018, H * 0.0035, H * 0.004), darkMat, 0, H * 0.003, 0, screw);
        slot.rotation.y = 0.6;
        const caseBack = caseZ - caseD / 2 - H * 0.002;
        [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sxn, syn]) => {
            const s = screw.clone(); s.rotation.x = Math.PI / 2; s.position.set(sxn * W * 0.44, syn * H * 0.42, caseBack); tv.add(s);

        for (let i = 0; i < 8; i++) {

                0, H * 0.02 + H * 0.4 * k + H * 0.001, backZ + backD * zf);

        const earX = W * 0.4875, earZ = caseZ;
        const ear = add(new THREE.CylinderGeometry(H * 0.11, H * 0.11, H * 0.06, 48), darkMat, earX + H * 0.03, H * 0.04, earZ);
        ear.rotation.z = Math.PI / 2;
        const pad = add(new THREE.TorusGeometry(H * 0.085, H * 0.022, 14, 48), new THREE.MeshPhysicalMaterial({ color: 0x141416, roughness: 0.65, sheen: 0.4 }),
            earX + H * 0.064, H * 0.04, earZ);

        const ring = add(new THREE.TorusGeometry(H * 0.11, H * 0.006, 10, 48), steel, earX + H * 0.002, H * 0.04, earZ);

    function makeCables(W, H, D, steel) {
        const g = new THREE.Group();

        const base = -H / 2;

            [-0.17, 0.00, -0.02, -0.22, -0.10, -0.045, -0.06], [ 0.17, 0.00, -0.02,  0.22, -0.10,  0.045, -0.06],
            [-0.09, 0.00, -0.06, -0.13, -0.14, -0.025, -0.08], [ 0.09, 0.00, -0.06,  0.13, -0.14,  0.025, -0.08],
            [-0.04, 0.15, -0.34, -0.10, -0.30, -0.015, -0.10], [ 0.04, 0.15, -0.34,  0.10, -0.30,  0.015, -0.10],
            [-0.26, 0.00, -0.10, -0.30, -0.20, -0.050, -0.12], [ 0.26, 0.00, -0.10,  0.30, -0.20,  0.050, -0.12],

    function upgradeMaterials(model) {
        model.traverse(o => {
            if (!o.isMesh) return;
            o.castShadow = true;
            o.receiveShadow = true;

                map: old.map, normalMap: old.normalMap, aoMap: old.aoMap, aoMapIntensity: 0.8,

        .then(r => r.arrayBuffer())
        .then(buf => new Promise((ok, fail) => loader.parse(buf, '', ok, fail)))

            model.position.z -= neckTop.z;

            neckTop.set(0, body.max.y, 0);

            const target = new THREE.Vector3(0, (frame.bottom + frame.top) / 2, 0);

            place(rimL, -2.4, 0.6, -1.6);

        uniforms: {

    function resize() {
        const w = holder.clientWidth, h = holder.clientHeight;
        if (!w || !h) return;

        composer.setPixelRatio(renderer.getPixelRatio());
        composer.setSize(w, h);
        bloom.resolution.set(w, h);
        grade.uniforms.uRes.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
        camera.aspect = w / h;
        const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const span = frame.top - frame.bottom;
        const fitH = span * 1.04 / (2 * t);
        const fitW = frame.width * 1.3 / (2 * t * camera.aspect);
        const dist = Math.max(fitH, fitW) * ZOOM_OUT;
        const cy = frame.top - TV_HEIGHT * 0.5 + span * 0.04;
        camera.position.set(0, cy, dist);
        camera.lookAt(0, cy, 0);
        applyView(w, h);
    }
    let viewShift = 0, viewTarget = 0;
    function applyView(w = holder.clientWidth, h = holder.clientHeight) {
        if (innerWidth > 860 && viewShift > 0.0005) camera.setViewOffset(w, h, -w * viewShift, 0, w, h);
        else camera.clearViewOffset();
        camera.updateProjectionMatrix();
    }
    window.echoView = { set(v) { viewTarget = innerWidth > 860 ? v : 0; if (reduce) { viewShift = viewTarget; applyView(); } } };

    const pointer = new THREE.Vector2(), look = new THREE.Vector2();
    let lift = 0, liftVel = 0;       // springy vertical offset of the whole figure
    if (!reduce) {
        addEventListener('pointermove', e => {
            pointer.x = (e.clientX / innerWidth) * 2 - 1;
            pointer.y = (e.clientY / innerHeight) * 2 - 1;

    }

    const clock = new THREE.Clock();
    let visible = true;
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) requestAnimationFrame(tick); }).observe(hero);

    function tick() {
        const delta = clock.getDelta();
        const t = clock.elapsedTime;
        const idleX = reduce ? 0 : Math.sin(t * 0.5) * 0.06, idleY = reduce ? 0 : Math.sin(t * 0.37) * 0.04;

        look.y += (pointer.y + idleY - look.y) * 0.07;
        if (Math.abs(viewTarget - viewShift) > 0.0003) { viewShift += (viewTarget - viewShift) * 0.06; applyView(); }
        const intro = reduce ? 1 : 1 - Math.pow(1 - Math.min(t / 2.2, 1), 3);
        pivot.rotation.y = (1 - intro) * -0.8 + look.x * 0.08;
        const dt = Math.min(delta || 0.016, 0.05);
        const liftTarget = reduce ? 0 : -pointer.y * BODY_LIFT + Math.sin(t * 1.3) * 0.002;
        liftVel += ((liftTarget - lift) * 90 - liftVel * 12) * dt;
        lift += liftVel * dt;
        pivot.position.y = lift * intro;
        aim(look.x * LOOK.yaw, look.y * LOOK.pitch);
        drawScreen(t, look.x);
        if (glowLight) glowLight.intensity = 0.9 * screenLevel;
        if (screenMat) { screenMat.uniforms.uTime.value = t; screenMat.uniforms.uLevel.value = screenLevel; }
        grade.uniforms.uTime.value = reduce ? 0 : t;
        composer.render();
        if (visible) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
</script>

    function paceWords(seconds) {
        clearInterval(wordTimer);
        const step = (seconds * 1000) / words.length;
        wordTimer = setInterval(() => { revealTo(shown + 1); if (shown >= words.length) clearInterval(wordTimer); }, step);
    }

    let speaking = false, audioEl = null;
    function pickVoice() {
        const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
        return voices.find(v => /natural|online/i.test(v.name))      // Edge's neural voices
            || voices.find(v => /google/i.test(v.name))
            || voices[0] || null;
    }

    let sayToken = 0;
    // Speak one line with captions. The greeting boots the TV with "HI"; answers show a short "thinking" beat.
    function say(next, question) {
        stopVoice();
        const token = ++sayToken;
        line = { rate: GREETING.rate, pitch: GREETING.pitch, audio: '', ...next };
        words = line.text.split(/\s+/);
        speaking = true;
        setState('speaking');
        talkLabel.textContent = 'Stop';
        hintEl.textContent = 'Turn your sound on';
        showCaption(question);
        if (window.echoTV) window.echoTV.auto(false);
        const isGreeting = next === GREETING;
        tv(isGreeting ? 'greeting' : 'thinking');
        setTimeout(() => { if (speaking && token === sayToken) tv('talking'); }, isGreeting ? 900 : 650);
        setTimeout(() => { if (speaking && token === sayToken) line.audio ? playFile() : speak(); }, isGreeting ? 600 : 450);
    }
    const greet = () => { markChip(null); say(GREETING); };

    function speak() {
        if (!('speechSynthesis' in window)) { revealTo(words.length); return finish(); }
        const text = line.text;
        const u = new SpeechSynthesisUtterance(text);
        const voice = pickVoice();
        if (voice) u.voice = voice;
        u.rate = line.rate; u.pitch = line.pitch;
        let gotBoundary = false;
        u.onstart = () => paceWords(text.length / 14 / line.rate);
        u.onboundary = e => {
            if (e.name && e.name !== 'word') return;
            if (!gotBoundary) { gotBoundary = true; clearInterval(wordTimer); }
            revealTo(text.slice(0, e.charIndex).split(/\s+/).filter(Boolean).length + 1);
        };
        u.onend = u.onerror = () => { if (speaking && line.text === text) finish(); };
        speechSynthesis.speak(u);
    }

    function playFile() {
        audioEl = new Audio(line.audio);
        audioEl.onloadedmetadata = () => paceWords(audioEl.duration || 4);
        audioEl.onended = audioEl.onerror = () => { if (speaking) finish(); };
        audioEl.play().catch(() => finish());
    }

    function stopVoice() {
        clearInterval(wordTimer);
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        if (audioEl) { audioEl.pause(); audioEl = null; }
    }

    function finish() {
        speaking = false;
        stopVoice();
        revealTo(words.length);
        setState('idle');
        tv('idle');
        talkLabel.textContent = 'Hear it again';
        hintEl.textContent = 'Echo says hello';
        markChip(null);
        hero.dataset.chips = '1';            // reveal the question pills after the first line
    }

    // Build the question pills
    const chipsEl = $('fh-chips');
    const chipEls = {};
    QUESTIONS.forEach(q => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'fh-chip';
        b.innerHTML = `<span class="fh-chip-ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[q.icon] || ICONS.sparkle}</svg>` +
                      `<span class="fh-chip-eq" aria-hidden="true"><i></i><i></i><i></i></span></span>`;
        b.append(q.label);
        b.addEventListener('click', () => {
            if (b.classList.contains('is-active')) return finish();   // click again to stop
            markChip(q.id);
            say(q, q.label);
        });
        chipsEl.appendChild(b);
        chipEls[q.id] = b;
    });
    const creditEl = document.querySelector('.fh-credit');
    function markChip(id) {
        Object.entries(chipEls).forEach(([k, el]) => {
            el.classList.toggle('is-active', k === id);
            el.setAttribute('aria-pressed', String(k === id));
        });
        if (creditEl) creditEl.classList.toggle('is-glow', id === 'creator');   // point at the credit card
    }

    talkBtn.addEventListener('click', () => (speaking ? finish() : greet()));
    addEventListener('pagehide', stopVoice);
    if ('speechSynthesis' in window) speechSynthesis.getVoices();

    let started = false;
    function begin(e) {
        if (started) return;
        if (e.target.closest && e.target.closest('.fh-credit')) return;   // let the credit links work
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        started = true;
        if (e.type === 'keydown') e.preventDefault();
        removeEventListener('pointerdown', begin);
        removeEventListener('keydown', begin);
        hero.dataset.started = '1';
        if (window.echoView) window.echoView.set(0.18);
        greet();
    }
    addEventListener('pointerdown', begin);
    addEventListener('keydown', begin);
</script>
<script>
    /* Brand mascot: eyes glance toward the cursor */
    (() => {
        const svg = document.querySelector('.fh-mascot');
        const eyes = svg && svg.querySelector('.m-eyes');
        if (!eyes) return;
        let raf = 0, mx = 0, my = 0;
        addEventListener('pointermove', e => {
            mx = e.clientX; my = e.clientY;
            if (raf) return;
            raf = requestAnimationFrame(() => {
                raf = 0;
                const r = svg.getBoundingClientRect();
                const dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height * .4);
                const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);
                eyes.style.transform = `translate(${(dx / d) * 4.5 * k}px, ${(dy / d) * 3 * k}px)`;
            });
        }, { passive: true });
    })();
</script>

</body>
